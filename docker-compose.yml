services:
  db:
    image: postgis/postgis:16-3.5
    container_name: aereo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aereo}
      POSTGRES_USER: ${POSTGRES_USER:-aereo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aereo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aereo} -d ${POSTGRES_DB:-aereo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    container_name: aereo-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aereo}:${POSTGRES_PASSWORD:-aereo}@db:5432/${POSTGRES_DB:-aereo}
      POSTGRES_DB: ${POSTGRES_DB:-aereo}
      POSTGRES_USER: ${POSTGRES_USER:-aereo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aereo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ENVIRONMENT: ${ENVIRONMENT:-local}
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
